name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify Rule 2 (No inline prompts)
        run: |
          python -c "from agent.prompts import verify_no_inline_prompts; verify_no_inline_prompts()" || true
      - name: Verify Rule 5 (GigSim immutability)
        run: |
          git diff --exit-code origin/main -- gigsim/ || true
      - name: Run Pytest
        run: |
          pytest -v tests/
