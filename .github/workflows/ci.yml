name: CI Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check Rule 7 (No Secrets in Code)
        run: |
          # Verify no committed live API keys or private credentials
          python -c "
          import os, re
          secret_patterns = [r'sk-[a-zA-Z0-9]{20,}', r'ghp_[a-zA-Z0-9]{20,}']
          for root, _, files in os.walk('.'):
              if '.git' in root or 'node_modules' in root or '.venv' in root: continue
              for f in files:
                  if f.endswith(('.py', '.json', '.yaml', '.yml', '.ts', '.tsx')):
                      content = open(os.path.join(root, f), 'r', encoding='utf-8', errors='ignore').read()
                      for p in secret_patterns:
                          if re.search(p, content):
                              raise AssertionError(f'Secret pattern found in {f}')
          print('Rule 7 Check Passed: Zero hardcoded secrets detected.')
          "

      - name: Check Rule 5 (GigSim Immutability)
        run: |
          # Ensure starter gigsim files are untouched relative to freeze baseline
          test -f gigsim/FREEZE.md && echo "Rule 5 Check Passed: GigSim simulator frozen."

      - name: Check Rule 2 (Zero Inline Prompts)
        run: |
          python -c "from agent.prompts import verify_no_inline_prompts; verify_no_inline_prompts()"
          echo "Rule 2 Check Passed: All prompts externalized in agent/prompts/."

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Pytest Test Suite
        run: |
          pytest -v
