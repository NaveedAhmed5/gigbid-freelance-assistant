[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gigbid"
version = "0.1.0"
description = "Autonomous multi-agent freelance bidding and client lifecycle system"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "GigBid Engineering Team", email = "dev@gigbid.ai" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",
    "cryptography>=42.0.0",
    "pyjwt>=2.8.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "rank-bm25>=0.2.2",
    "networkx>=3.2.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pypdf>=4.2.0",
    "pyyaml>=6.0.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "mcp_servers"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
pythonpath = ["."]
